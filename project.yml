name: CamZ
options:
  bundleIdPrefix: com.akhilesh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # No development team is set here. Choose your own team in Xcode under Signing & Capabilities.

targets:
  CamZ:
    type: application
    platform: iOS
    sources: [CamZ]
    info:
      path: CamZ/Info.plist
      properties:
        CFBundleDisplayName: Cam Z
        CFBundleName: Cam Z
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: Cam Z uses the camera to analyse the scene and take photos with AI-directed exposure and framing.
        NSPhotoLibraryAddUsageDescription: Cam Z saves the photos you take to your library.
        # Cam Z Pro product IDs from App Store Connect. Empty means Pro is not set up in this build.
        CamZProMonthlyProductID: com.akhilesh.camz.pro.monthly
        CamZProAnnualProductID: com.akhilesh.camz.pro.annual
        # Legal pages: leave empty until they exist. An empty value hides the link in the paywall.
        CamZPrivacyPolicyURL: ""
        CamZTermsURL: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhilesh.camz
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  CamZTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CamZTests]
    dependencies:
      - target: CamZ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akhilesh.camzTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  CamZ:
    build:
      targets:
        CamZ: all
        CamZTests: [test]
    test:
      targets: [CamZTests]
